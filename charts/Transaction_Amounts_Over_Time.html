<!DOCTYPE html>
<html>
<head>
    <title>Transaction Amounts Over Time</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .chart-container { width: 800px; height: 500px; margin: auto; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h2>Transaction Amounts Over Time</h2>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['2025-10-15 00:00:00', '2025-11-20 00:00:00', '2025-11-25 00:00:00', '2025-12-10 00:00:00', '2025-12-20 00:00:00', '2026-01-15 00:00:00', '2026-02-10 00:00:00', '2026-03-05 00:00:00'],
                datasets: [{
                    label: 'Transaction Amounts Over Time',
                    data: [2000.0, 500.0, 1000.0, 3000.0, 2000.0, 1500.0, 4000.0, 2500.0],
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)',
                        'rgba(199, 199, 199, 0.6)',
                        'rgba(83, 102, 255, 0.6)'
                    ],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    title: {
                        display: true,
                        text: 'Transaction Amounts Over Time'
                    }
                }
            }
        });
    </script>
</body>
</html>

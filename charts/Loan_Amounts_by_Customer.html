<!DOCTYPE html>
<html>
<head>
    <title>Loan Amounts by Customer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .chart-container { width: 800px; height: 500px; margin: auto; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h2>Loan Amounts by Customer</h2>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Ethan Hunt', 'Diana Prince', 'Hannah Lee', 'Bob Johnson', 'George Martin', 'Charlie Brown', 'Fiona Gallagher', 'Alice Smith'],
                datasets: [{
                    label: 'Loan Amounts by Customer',
                    data: [30000.0, 25000.0, 22000.0, 20000.0, 18000.0, 15000.0, 12000.0, 10000.0],
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)',
                        'rgba(199, 199, 199, 0.6)',
                        'rgba(83, 102, 255, 0.6)'
                    ],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    title: {
                        display: true,
                        text: 'Loan Amounts by Customer'
                    }
                }
            }
        });
    </script>
</body>
</html>

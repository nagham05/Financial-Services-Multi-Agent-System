<!DOCTYPE html>
<html>
<head>
    <title>Investment Values by Customer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .chart-container { width: 800px; height: 500px; margin: auto; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h2>Investment Values by Customer</h2>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Bob Johnson', 'Ethan Hunt', 'Diana Prince', 'George Martin', 'Alice Smith', 'Hannah Lee', 'Charlie Brown', 'Fiona Gallagher'],
                datasets: [{
                    label: 'Investment Values by Customer',
                    data: [12000.0, 8500.0, 7500.0, 6500.0, 5500.0, 4200.0, 2500.0, 1800.0],
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)',
                        'rgba(199, 199, 199, 0.6)',
                        'rgba(83, 102, 255, 0.6)'
                    ],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    title: {
                        display: true,
                        text: 'Investment Values by Customer'
                    }
                }
            }
        });
    </script>
</body>
</html>
